{% load static %}<!DOCTYPE html>
<html lang="en">
<head>

<title>{% block title %}Yuhm Yuhm Catering Services{% endblock %}</title>
<meta name="description" content="Continental and intercontinental catering for weddings, corporate events and parties.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>

<script src="{% static 'catering/js/main.js' %}"></script>
